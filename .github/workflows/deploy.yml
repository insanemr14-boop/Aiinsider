name: Deploy to GitHub Pages

on:
  # Publish on every push to the production branch.
  push:
    branches: [main]
  # Allow a manual redeploy from the Actions tab without a code change.
  workflow_dispatch:

# Least-privilege token: read the repo, publish to Pages, and mint the OIDC
# token deploy-pages uses. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so an in-flight
# publish is not left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # `enablement: true` creates the Pages site on the first run, so the
        # repo does not need Settings -> Pages touched by hand. Without it the
        # deploy job fails instantly with "Not Found" against the Pages API.
        #
        # The custom domain is NOT set here — it comes from `public/CNAME`,
        # which Astro copies into dist/ and Pages reads on publish.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node 20+.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        # Schema and internal-link check. Runs before the build because its
        # failure messages name the offending file and field, whereas a Zod
        # failure inside the build is noisier to read.
        run: npm run validate

      - name: Build site
        # Runs `astro build` then indexes the output with Pagefind.
        run: npm run build

      - name: Verify build output
        # Fail loudly here rather than deploying an empty or broken site.
        run: |
          test -f dist/index.html      || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/404.html        || { echo "::error::dist/404.html missing"; exit 1; }
          test -f dist/CNAME           || { echo "::error::dist/CNAME missing — custom domain would be dropped"; exit 1; }
          test -f dist/robots.txt      || { echo "::error::dist/robots.txt missing"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "::error::sitemap missing"; exit 1; }
          test -f dist/rss.xml         || { echo "::error::rss.xml missing"; exit 1; }
          test -d dist/tools           || { echo "::error::tool directory missing"; exit 1; }
          test -d dist/agents          || { echo "::error::agent directory missing"; exit 1; }
          test -d dist/prompts         || { echo "::error::prompt library missing"; exit 1; }
          test -d dist/pagefind        || echo "::warning::pagefind index missing — search will fall back"
          echo "Pages built: $(find dist -name '*.html' | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
